name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:

    name: build
    runs-on: inseven-macos-26

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Ensure we're using the latest version of mise in an attempt to catch upstream errors early.
    - name: Get the latest mise version
      id: mise
      run: echo "version=$(curl -fsSL https://mise.jdx.dev/VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install mise
      uses: jdx/mise-action@v4
      with:
        version: ${{ steps.mise.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: exec ./scripts/build.sh

    - name: Release
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: scripts/release.sh

  documentation-build:
    runs-on: inseven-macos-26
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build documentation
      run: |
        scripts/build-documentation.sh
        chmod -v -R +rX "_site/"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5

  documentation-deploy:

    needs: documentation-build
    if: ${{ github.ref == 'refs/heads/main' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
