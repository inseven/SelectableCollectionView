name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 14 * * 1'  # 04:00 Monday, HST.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:

    name: build
    runs-on: inseven-macos-26

    env:

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.10
        cache: false

    - name: Build
      run: exec ./scripts/build.sh

    - name: Release
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: scripts/release.sh

  documentation-build:
    runs-on: inseven-macos-26
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build documentation
      run: |
        scripts/build-documentation.sh
        chmod -v -R +rX "_site/"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5

  documentation-deploy:

    needs: documentation-build
    if: ${{ github.ref == 'refs/heads/main' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
